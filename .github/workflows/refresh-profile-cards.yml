name: Refresh profile cards

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-profile-cards.yml'
      - 'scripts/refresh_profile_cards.py'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Refresh cards and preserve previous cards on errors
        id: cards
        continue-on-error: true
        run: python3 scripts/refresh_profile_cards.py

      - name: Commit refreshed cards
        run: |
          git add -- assets/stats.svg assets/languages.svg assets/streak.svg assets/trophies.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh profile cards'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report unavailable providers
        if: steps.cards.outcome == 'failure'
        run: |
          echo 'Some providers failed. Their previous cards remain available.'
          exit 1
